<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finavest Pte. Ltd.</title>
<meta name="description" content="Finavest Pte. Ltd. — commodity trading, Singapore.">
<style>
  :root { --ink:#14233a; --muted:#5b6b80; --line:#d9e0e8; --bg:#f7f9fb; --accent:#1f5f8b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  main { max-width:560px; width:100%; text-align:center; }
  .mark { width:56px; height:56px; margin:0 auto 28px; border-radius:12px;
          background:var(--accent); color:#fff; font:700 28px/56px Georgia, serif; }
  h1 { font-size:34px; font-weight:600; letter-spacing:.5px; }
  .tag { margin-top:10px; color:var(--muted); font-size:16px; letter-spacing:2px; text-transform:uppercase; }
  hr { border:0; border-top:1px solid var(--line); margin:32px auto; width:80px; }
  p { color:var(--muted); font-size:16px; line-height:1.6; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  footer { margin-top:48px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark">F</div>
  <h1>Finavest Pte. Ltd.</h1>
  <div class="tag">Commodity Trading &middot; Singapore</div>
  <hr>
  <p>Our new website is on its way.</p>
  <p>For enquiries, please contact<br>
     <a href="mailto:stanley_wang@finavest.sg">stanley_wang@finavest.sg</a></p>
  <footer>&copy; 2026 Finavest Pte. Ltd. All rights reserved.</footer>
</main>
</body>
</html>
